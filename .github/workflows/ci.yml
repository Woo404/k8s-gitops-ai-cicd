name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest -q
      - name: CLI smoke (rules only)
        run: python -m ci_copilot --log samples/failed_pytest.log --no-llm

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Helm lint + template + kubeconform
        run: ./scripts/validate_k8s.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - working-directory: onprem/ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          cp inventory.example.ini inventory.ini
          ansible-playbook site.yml --syntax-check
          ansible-lint site.yml
      - name: shellcheck
        run: shellcheck onprem/scripts/*.sh scripts/*.sh
