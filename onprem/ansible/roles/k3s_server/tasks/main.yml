---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_server_bin

- name: Download k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_server_install_script_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_server_bin.stat.exists

- name: Install k3s server (idempotent - skipped if binary exists)
  ansible.builtin.command: /tmp/k3s-install.sh server {{ k3s_server_extra_args }}
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not k3s_server_bin.stat.exists
  changed_when: true

- name: Wait for node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Read node join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_token_raw
  no_log: true

- name: Share token with agents via a fact
  ansible.builtin.set_fact:
    k3s_server_node_token: "{{ k3s_server_token_raw.content | b64decode | trim }}"
  no_log: true

- name: Fetch kubeconfig to the control machine
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_kubeconfig_local }}"
    flat: true

- name: Point fetched kubeconfig at the server IP instead of 127.0.0.1
  ansible.builtin.replace:
    path: "{{ k3s_kubeconfig_local }}"
    regexp: "https://127.0.0.1:6443"
    replace: "{{ k3s_server_url }}"
  delegate_to: localhost
  become: false
