---
- name: Prepare all k3s nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load br_netfilter
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Kernel params for Kubernetes networking
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_set: true
        state: present
      loop:
        - net.ipv4.ip_forward
        - net.bridge.bridge-nf-call-iptables

- name: Install k3s server
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Join k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - k3s_agent

- name: Bootstrap Argo CD and the root Application
  hosts: k3s_server[0]
  become: true
  roles:
    - argocd_bootstrap
